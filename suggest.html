<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เสนอนโยบาย - กาดกระป๋อง</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-950 text-white font-prompt min-h-screen flex flex-col">

    <nav class="w-full bg-gray-950/80 backdrop-blur-md z-50 border-b border-green-500/30">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center h-16">
            <a href="index.html" class="flex items-center gap-2 hover:opacity-80">
                <div class="w-8 h-8 bg-green-500 rounded-md flex items-center justify-center text-black font-bold text-xl">ก</div>
                <span class="text-xl font-bold tracking-wider">กาดกระป๋อง</span>
            </a>
            <div class="text-sm font-medium">
                <a href="index.html" class="text-gray-400 hover:text-green-400 transition mr-4">← กลับหน้าแรก</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center py-12 px-4 relative">
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-green-600/10 rounded-full blur-[100px] -z-10"></div>

        <div class="max-w-2xl w-full">
            <div class="bg-gray-900 rounded-2xl p-8 md:p-10 border border-green-500/30 shadow-[0_0_30px_rgba(34,197,94,0.1)] relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-green-500 to-transparent"></div>
                
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-bold text-white mb-3">💡 เสนอนโยบาย / ไอเดีย</h1>
                    <p class="text-sm text-gray-400 leading-relaxed">อยากให้โรงเรียนมีกิจกรรมอะไร กีฬาแบบไหน หรือมีแข่ง E-sports เกมอะไร เสนอมาได้เลย ข้อความจะส่งตรงถึง Discord ของพวกเราแบบ Real-time!</p>
                </div>

                <form id="discord-form" class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">ชื่อ-นามสกุล หรือ นามแฝง (ชั้น/ห้อง)</label>
                        <input type="text" id="senderName" required
                            class="w-full bg-gray-950 border border-gray-800 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition" 
                            placeholder="เช่น การ์ตูน ม.6/1">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">หัวข้อนโยบาย</label>
                        <input type="text" id="topic" required
                            class="w-full bg-gray-950 border border-gray-800 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition" 
                            placeholder="เช่น ขอจัดแข่ง Valorant ในงานโรงเรียน">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">รายละเอียด</label>
                        <textarea id="detail" rows="5" required
                            class="w-full bg-gray-950 border border-gray-800 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition" 
                            placeholder="อธิบายสิ่งที่คุณอยากให้เกิดขึ้น..."></textarea>
                    </div>
                    <button type="submit" id="submitBtn"
                        class="w-full bg-green-500 hover:bg-green-400 text-black font-bold py-3 px-4 rounded-lg transition duration-300 flex justify-center items-center gap-2 mt-4">
                        <span>ส่งข้อความเข้า Discord</span>
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                    </button>
                </form>
                
                <div id="success-message" class="hidden mt-6 p-4 bg-green-500/20 border border-green-500 rounded-lg text-center text-green-400 text-sm font-medium">
                    ✅ ส่งนโยบายสำเร็จ! ข้อมูลถูกส่งเข้า Discord ทีมงานเรียบร้อยครับ
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
